# Let the JDK launcher and Gradle's @argfile writer use the same native charset.
# Forcing UTF-8 here breaks JDK 17 test classpaths in this Windows Chinese path.
org.gradle.jvmargs=-Xmx2048m
android.useAndroidX=true
# AGP rejects non-ASCII Windows paths before compilation. This repository's
# authorized workspace uses a Chinese name; verify the actual build here.
android.overridePathCheck=true
kotlin.code.style=official
