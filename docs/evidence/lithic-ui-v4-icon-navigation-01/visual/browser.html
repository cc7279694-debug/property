<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>砺石 V4 悬浮图标导航对照</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#edf1f4;color:#191c20;font-family:"Microsoft YaHei UI","Noto Sans CJK SC",sans-serif}
h1,h2,p,figure{margin:0}
.board{margin:24px auto;padding:26px;width:max-content;max-width:100%;background:#f8fafb;border:1px solid #dfe5ea;border-radius:18px}
.board-header{margin-bottom:22px}
.board-header h1,.board-header h2{font-size:24px;line-height:1.4}
.board-header p{margin-top:4px;color:#4b5b6d;font-size:13px;line-height:1.6}
.compare-labels,.compare-row{display:grid;grid-template-columns:repeat(2,360px);gap:14px}
.compare-row .screen{justify-content:flex-end}
.compare-labels{margin-bottom:8px;font-size:13px;font-weight:600;color:#4b5b6d}
.theme-label{font-size:12px;font-weight:600;color:#4b5b6d;margin:12px 0 6px}
.cases{display:grid;grid-template-columns:320px 360px 400px;gap:14px}
.case figcaption{font-size:12px;font-weight:600;color:#4b5b6d;margin-bottom:6px}
.case-row{display:grid;gap:14px}
.screen{
    --app:#fff;--old:#f7f8fa;--bar:#f7f8fa;--line:#e4e7eb;--selection:#eff4fa;
    --fg:#191c20;--muted:#565d67;--primary:#223246;--on-primary:#fff;
    --elevation:0 2px 5px #18222e20;--font-scale:1;--safe:24px;
    color:var(--fg);background:var(--app);width:var(--window);position:relative;
    display:flex;flex-direction:column;overflow:hidden;border-radius:14px;
    outline:1px solid var(--line);outline-offset:-1px
}
.screen[data-theme=mist]{
    --app:#edf2f7;--old:#e8eff6;--bar:#fff;--line:#d3dee9;--selection:#e8eff6;
    --fg:#1c2733;--muted:#4b5b6d
}
.screen[data-theme=dark]{
    --app:#121212;--old:#1e1e1e;--bar:#1e1e1e;--line:#343434;--selection:#202c39;
    --fg:#f3f3f3;--muted:#b2b2b2;--primary:#e9e9e9;--on-primary:#161616;--elevation:none
}
.screen[data-mode=three]{--safe:48px}
.add-slot{padding:12px 16px 8px}
.add{
    display:flex;gap:7px;align-items:center;justify-content:center;min-height:48px;
    background:var(--primary);color:var(--on-primary);border-radius:999px;
    font-size:calc(15px * var(--font-scale));line-height:1.4;font-weight:650
}
.add svg{width:16px;height:16px}
.anchor{display:flex;justify-content:center;padding:4px 16px 14px}
.bar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:center}
.bar.new{
    width:min(210px,100%);height:58px;padding:5px;position:relative;
    background:var(--bar);border-radius:999px;box-shadow:var(--elevation)
}
.bar.new::after{
    content:"";position:absolute;inset:0;border:1px solid var(--line);
    border-radius:inherit;pointer-events:none
}
.bar.old{
    margin-top:0;min-height:57px;background:var(--old);border-top:1px solid var(--line)
}
.tab{
    font:inherit;border:0;color:var(--muted);background:transparent;
    display:flex;align-items:center;justify-content:center;
    padding:0;min-width:0;cursor:pointer;touch-action:manipulation
}
.tab[aria-selected=true]{color:var(--fg)}
.tab:focus-visible{outline:2px solid var(--fg);outline-offset:-2px;border-radius:999px}
.glyph{
    width:24px;height:24px;display:block;flex:none;fill:none;stroke:currentColor;
    stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round
}
.inset-circle{
    width:40px;height:40px;border-radius:50%;display:grid;place-items:center;
    transition:background-color 200ms,color 200ms
}
.new .tab{height:48px}
.new [aria-selected=true] .inset-circle{background:var(--selection)}
.old .tab{min-height:56px;flex-direction:column;gap:2px}
.old .tab[aria-selected=true]{font-weight:650;color:var(--primary)}
[data-theme=dark] .old .tab[aria-selected=true]{color:var(--fg)}
.old .tab span{font-size:12px;line-height:16px}
.safe{
    height:var(--safe);display:flex;align-items:center;justify-content:center;color:var(--fg)
}
.bar.old+.safe{background:var(--old)}
.safe.gesture::before{content:"";display:block;width:108px;height:4px;border-radius:999px;background:currentColor;opacity:.82}
.safe.three{justify-content:space-evenly}
.safe.three svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.35;opacity:.82}
.matrix-test .screen{position:relative}
#matrix-test{display:none}
#matrix-test.enabled{display:block;padding:16px}
@media(max-width:1160px){.cases{display:flex;flex-wrap:wrap}}
@media(max-width:790px){.board{overflow:auto}.compare-labels,.compare-row{grid-template-columns:1fr}.compare-labels{display:none}}
@media(prefers-reduced-motion:reduce){.inset-circle{transition:none}}
</style>
</head>
<body>
<section class="board" id="comparison" aria-label="新旧导航和三主题对照">
<header class="board-header"><h1>砺石 V4 · 悬浮图标导航</h1><p>浏览器对照图 · 以 360dp 等比示意 · Android 实测未运行</p></header>
<div class="compare-labels"><span>旧版 · 通栏图标与文字</span><span>V4 · 悬浮图标胶囊</span></div>
<div id="comparison-rows"></div>
</section>
<section class="board" id="responsive" aria-label="窗口宽度和字体缩放对照">
<header class="board-header"><h2>320 / 360 / 400dp 布局</h2><p>浏览器模拟 100% / 200% 字号与系统栏占位。Android 系统字体、手势和三键需要原生复验。</p></header>
<div class="case-row" id="responsive-rows"></div>
</section>
<div id="matrix-test" class="matrix-test" aria-label="浏览器检查样本"></div>

<script>
'use strict';
const themes = { white: '纯白', mist: '岩白雾蓝', dark: '深色黑灰' };
// Path data is checked by verify-browser.cjs against the three Android VectorDrawable files.
const destinations = [
  { id:'home', name:'首页', old:'现在', path:'M2.5,10.5 L12,2.8 L21.5,10.5 M5,8.5 L5,21 L10,21 L10,15 L14,15 L14,21 L19,21 L19,8.5' },
  { id:'review', name:'回看', old:'回看', path:'M4.5,20 L4.5,14 M9.5,20 L9.5,11 M14.5,20 L14.5,7.5 M19.5,20 L19.5,3.5' },
  { id:'settings', name:'设置', old:'设置', path:'M9.76,4.68 L10.21,2.77 L13.79,2.77 L14.24,4.68 L15.59,5.25 L17.26,4.21 L19.79,6.74 L18.75,8.41 L19.32,9.76 L21.23,10.21 L21.23,13.79 L19.32,14.24 L18.75,15.59 L19.79,17.26 L17.26,19.79 L15.59,18.75 L14.24,19.32 L13.79,21.23 L10.21,21.23 L9.76,19.32 L8.41,18.75 L6.74,19.79 L4.21,17.26 L5.25,15.59 L4.68,14.24 L2.77,13.79 L2.77,10.21 L4.68,9.76 L5.25,8.41 L4.21,6.74 L6.74,4.21 L8.41,5.25 Z M15.35,12 A3.35,3.35 0,0 1,8.65,12 A3.35,3.35 0,0 1,15.35,12 Z' }
];

function glyph(id,path) {
    return `<svg class="glyph" aria-hidden="true" viewBox="0 0 24 24" data-glyph="${id}"><path d="${path}"/></svg>`;
}
function bar(selected, old) {
    return `<nav class="bar ${old ? 'old' : 'new'}" role="tablist" aria-label="主导航">
        ${destinations.map((item,index) => {
            const icon = glyph(item.id,item.path);
            const inside = old ? icon + `<span>${item.old}</span>` : `<span class="inset-circle">${icon}</span>`;
            return `<button class="tab" type="button" role="tab" aria-label="${item.name}" aria-selected="${index === selected}" tabindex="${index === selected ? 0 : -1}">${inside}</button>`;
        }).join('')}
    </nav>`;
}
function safeArea(mode) {
    return mode === 'gesture' ? '<div class="safe gesture" aria-hidden="true"></div>' :
      '<div class="safe three" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="m10 2-6 6 6 6"/></svg><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="5"/></svg><svg viewBox="0 0 16 16"><rect x="3" y="3" width="10" height="10" rx="2"/></svg></div>';
}
function screen({ theme='white', width=360, scale=1, mode='gesture', selected=0, old=false, add=true }={}) {
    const action = add ? `<div class="add-slot"><div class="add">${glyph('add','M12 5v14 M5 12h14')}添加</div></div>` : '';
    const navigation = old ? bar(selected,true) : `<div class="anchor">${bar(selected,false)}</div>`;
    return `<div class="screen" data-theme="${theme}" data-mode="${mode}" data-width="${width}" data-scale="${scale}" style="--window:${width}px;--font-scale:${scale}">${action}${navigation}${safeArea(mode)}</div>`;
}
function populate() {
    document.querySelector('#comparison-rows').innerHTML = Object.entries(themes).map(([theme,label],selected) => {
        return `<section><h2 class="theme-label">${label} · 选中${destinations[selected].name}</h2><div class="compare-row">
            ${screen({theme,selected,old:true,add:false})}${screen({theme,selected,add:false})}</div></section>`;
    }).join('');
    document.querySelector('#responsive-rows').innerHTML = [1,2].map(scale => {
       const mode = scale === 1 ? 'gesture' : 'three';
       return `<div class="cases">${[320,360,400].map((width,index) => {
           const theme = Object.keys(themes)[index];
           const label = `${width}dp · ${scale*100}% · ${mode === 'gesture' ? '手势' : '三键'}占位`;
           return `<figure class="case"><figcaption>${label}</figcaption>${screen({theme,width,scale,mode})}</figure>`;
       }).join('')}</div>`;
    }).join('');
}
function setTab(button) {
    for (const item of button.parentElement.querySelectorAll('[role=tab]')) {
        const selected = item === button;
        item.setAttribute('aria-selected',selected);
        item.tabIndex = selected ? 0 : -1;
    }
}
document.addEventListener('click',event => {
    const tab = event.target.closest('[role=tab]');
    if (tab) setTab(tab);
});
document.addEventListener('keydown',event => {
    const button = event.target.closest('[role=tab]');
    if (!button || !['ArrowLeft','ArrowRight','Home','End'].includes(event.key)) return;
    const items = [...button.parentElement.querySelectorAll('[role=tab]')];
    const index = items.indexOf(button);
    const next = {ArrowLeft:(index+2)%3,ArrowRight:(index+1)%3,Home:0,End:2}[event.key];
    event.preventDefault();
    setTab(items[next]);
    items[next].focus();
});
populate();
window.createNavigationMatrix = () => {
    const container = document.querySelector('#matrix-test');
    container.innerHTML = Object.keys(themes).flatMap(theme => [320,360,400].flatMap(width =>
        [1,2].flatMap(scale => ['gesture','three'].map(mode => screen({ theme,width,scale,mode }))))).join('');
    container.classList.add('enabled');
};
</script>
</body>
</html>
